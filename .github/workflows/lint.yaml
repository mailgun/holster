# Workflow for Go Static Code Analysis check,
# See https://mailgun.atlassian.net/wiki/spaces/ENG/pages/4278943767/Go+Static+Code+Analysis+Linters

name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  GOLANGCI_LINT_VERSION: v2.4.0

jobs:
  lint:
    name: lint
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
          cache: true # caching and restoring go modules and build outputs

      - name: Check that 'go mod tidy' was called before commit
        run: go mod tidy && git diff --exit-code

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          skip-cache: true # cache/restore is done by actions/setup-go step
          args: -v
